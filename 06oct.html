    <title>Document</title>
    <style>
        #parent{
            height: 100vh;
            border: 2px solid;
            display: grid;
            grid-template-columns: 300px 300px 300px ;
            grid-template-rows: 100px 300px;
            gap: 10px;
        }
        .one{
            border: 2px solid red;
        } 
       .one:hover{
        transform: scale(1,2);
       }
        img{
            height: 100%;
            width: 100%;
        }
        #one{
            grid-row: 3;
            grid-column: 2;
        }
       
    </style>
</head>
