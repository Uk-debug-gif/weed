<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        #parents{
            height: 400px;
            width: 400px;
           margin: 0px auto;
           border: solid;
         
           border-radius: 20px;
            position: relative;
        }
        #onec{
            height: 50%;
            width: 100%;
            border-radius: 20px;
            background-color: blue;
            position: absolute;
            top: 0px;
        }
        #child{
            height: 110px;
            width: 110px;
            border-radius: 50%;
            background-color: beige;
            margin: 0px auto;
            top: 8px;
            left: 1px;
            border: solid;
            position: relative;
        }

    </style>
    
</head>
<body>
    <div id="parents">
        <div id="onec">
            <div id="child"></div>
        </div>
   </div>
